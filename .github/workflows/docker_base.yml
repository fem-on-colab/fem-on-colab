name: Release new docker image containing the base environment

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the released image to docker registry (yes or no, default no)"
  workflow_call:
    inputs:
      push:
        description: "Push the released image to docker registry (yes or no, default no)"
        type: string

env:
  IMAGE_PREFIX: ghcr.io/fem-on-colab/base

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Determine whether to push the released image to docker registry
        id: push
        run: |
          PUSH=${{ (inputs || github.event.inputs).push }}
          if [[ "${PUSH}" == "yes" ]]; then
            echo "push=yes" >> ${GITHUB_OUTPUT}
          else
            echo "push=no" >> ${GITHUB_OUTPUT}
          fi
        shell: bash
      - name: Build docker image
        run: |
          docker build --pull -t ${IMAGE_PREFIX}:latest -f base/Dockerfile .
      - name: Print docker image size
        run: |
          SIZE=$(docker image inspect "${IMAGE_PREFIX}:latest" --format='{{.Size}}')
          echo "Final image size: $(numfmt --to=iec "$SIZE")"
      - name: Print biggest apt packages
        run: |
          docker run --rm -i "${IMAGE_PREFIX}:latest" sh -s <<'SH'
          dpkg-query -W -f='${Installed-Size}\t${Package}\n' |
            sort -nr |
            head -20 |
            awk '{printf "%.1f MB\t%s\n", $1/1024, $2}'
          SH
      - name: Print biggest pip packages
        run: |
          docker run --rm -i "${IMAGE_PREFIX}:latest" python3 - <<'PY'
          import importlib.metadata
          import os

          rows = []

          for dist in importlib.metadata.distributions():
              try:
                  size = sum(
                      os.path.getsize(dist.locate_file(f))
                      for f in (dist.files or [])
                      if os.path.isfile(dist.locate_file(f))
                  )
                  rows.append((size, dist.metadata["Name"]))
              except (OSError, TypeError):
                  pass

          for size, name in sorted(rows, reverse=True)[:20]:
              print(f"{size / 1024 / 1024:8.1f} MB  {name}")
          PY
      - name: Determine image tag
        if: github.repository == 'fem-on-colab/fem-on-colab' && steps.push.outputs.push == 'yes'
        id: image_name
        run: |
          IMAGE_TAG=$(docker run -i ${IMAGE_PREFIX}:latest bash /usr/bin/compute_docker_tag.sh)
          echo "image_tag=${IMAGE_TAG}" >> ${GITHUB_OUTPUT}
      - name: Log into the docker registry
        if: github.repository == 'fem-on-colab/fem-on-colab' && steps.push.outputs.push == 'yes'
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push to the docker registry
        if: github.repository == 'fem-on-colab/fem-on-colab' && steps.push.outputs.push == 'yes'
        run: |
          IMAGE_TAG="${{ steps.image_name.outputs.image_tag }}"
          docker tag ${IMAGE_PREFIX}:latest ${IMAGE_PREFIX}:${IMAGE_TAG}
          docker push ${IMAGE_PREFIX}:latest
          docker push ${IMAGE_PREFIX}:${IMAGE_TAG}
